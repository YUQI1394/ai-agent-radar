name: Refresh AI agent feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-static-feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate verified static feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/refresh-static-feed.js
      - name: Verify generated feed and application
        run: node scripts/validate-static-feed.js && npm test && npm run check
      - name: Publish changed feed
        shell: bash
        run: |
          if git diff --quiet -- data; then
            echo "No feed changes to publish."
            exit 0
          fi
          git config user.name "ai-agent-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/agents.json data/archive.json data/weekly-reports.json
          git commit -m "data: refresh GitHub agent feed"
          git push
