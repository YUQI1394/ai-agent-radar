name: Refresh AI agent feed

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for matching production deployment
        if: github.event_name == 'push'
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in {1..30}; do
            health="$(curl --show-error --silent --retry 2 --retry-all-errors https://getaiagentradar.com/health?deployment=1)" || true
            deployed="$(jq -r '.deploymentCommit // empty' <<<"${health}")"
            if [[ "${deployed}" == "${EXPECTED_COMMIT}" ]]; then
              echo "Matching production deployment verified on attempt ${attempt}."
              exit 0
            fi
            echo "Waiting for production commit ${EXPECTED_COMMIT:0:7}; currently ${deployed:0:7}."
            sleep 10
          done
          echo "Matching production deployment did not become ready."
          exit 1
      - name: Refresh production feed
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          oidc_token="$(curl --fail --show-error --silent \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ai-agent-radar-refresh" | jq -r '.value')"
          for attempt in {1..12}; do
            refresh="$(curl --fail --show-error --silent --retry 2 --retry-all-errors \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "X-GitHub-Token: ${GITHUB_TOKEN}" \
              -H "X-Expected-Commit: ${GITHUB_SHA}" \
              https://getaiagentradar.com/api/fetch-agents)" || true
            if jq -e --arg commit "${GITHUB_SHA}" '.ingestion.deploymentCommit == $commit' <<<"${refresh}" >/dev/null; then
              echo "Current production function refreshed the feed on attempt ${attempt}."
              exit 0
            fi
            echo "Refresh response came from a stale function; retrying."
            sleep 10
          done
          echo "Current production function never completed the refresh."
          jq . <<<"${refresh}" || true
          exit 1
      - name: Verify production data health
        shell: bash
        run: |
          for attempt in {1..12}; do
            health="$(curl --fail --show-error --silent --retry 3 --retry-all-errors https://getaiagentradar.com/health)" || true
            if jq -e '.status == "healthy" and .checks.feedFresh and .checks.issueCoverage and .checks.demandEvidence and .checks.evidenceContext and .checks.professionalBreadth and .checks.refreshComplete and .checks.refreshDeployment' <<<"${health}" >/dev/null; then
              echo "Production data health verified on attempt ${attempt}."
              exit 0
            fi
            sleep 10
          done
          echo "Production data health did not become ready."
          jq . <<<"${health}" || true
          exit 1
