name: Refresh AI agent feed

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - "api/fetch-agents.js"
      - "lib/radar.js"
      - ".github/workflows/refresh-agents.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh production feed
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          oidc_token="$(curl --fail --show-error --silent \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ai-agent-radar-refresh" | jq -r '.value')"
          curl --fail --show-error --silent --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "X-GitHub-Token: ${GITHUB_TOKEN}" \
            https://getaiagentradar.com/api/fetch-agents
      - name: Verify production data health
        shell: bash
        run: |
          curl --fail --show-error --silent --retry 3 --retry-all-errors \
            https://getaiagentradar.com/health \
            | jq -e '.status == "healthy" and .checks.feedFresh and .checks.issueCoverage and .checks.demandEvidence and .checks.refreshComplete'
