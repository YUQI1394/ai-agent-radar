name: Refresh AI agent feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh production feed
        run: curl --fail --show-error --silent --retry 3 --retry-all-errors https://ai-agent-radar.vercel.app/api/fetch-agents
