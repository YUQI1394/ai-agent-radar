name: Verify production experience

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Wait for matching production deployment
        if: github.event_name == 'push'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in {1..30}; do
            deployed="$(curl --show-error --silent --retry 2 --retry-all-errors https://getaiagentradar.com/health | jq -r '.deploymentCommit // empty')" || true
            if [[ "${deployed}" == "${EXPECTED_COMMIT}" ]]; then
              echo "Matching production deployment verified."
              exit 0
            fi
            sleep 10
          done
          echo "Production did not reach ${EXPECTED_COMMIT}."
          exit 1
      - name: Test public production journey
        run: node scripts/smoke-test.js
