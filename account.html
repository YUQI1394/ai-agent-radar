<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, follow"><link rel="stylesheet" href="/styles.css"><link rel="icon" href="/favicon.svg"><title>Account · AI Agent Radar</title></head><body><header class="site-header"><a class="brand" href="/">AI Agent Radar</a><nav class="site-nav"><a href="/">Home</a><a href="/workspace">Workspace</a></nav></header><main class="page-shell auth-shell"><section class="auth-card"><span class="eyebrow">YOUR FREE ACCOUNT</span><h1>Account</h1><div id="account-state" class="auth-message">Loading your account…</div><div id="account-details" hidden><p>Signed in as <strong id="account-email"></strong></p><p>Your account is free. No payment method is required.</p><div class="workspace-actions"><a class="button button-primary" href="/workspace">Open workspace</a><button class="button button-secondary" id="sign-out" type="button">Sign out on this device</button></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script><script src="/auth.js"></script><script>RadarAuth.ready.then((auth)=>{const state=document.querySelector('#account-state');if(!auth.user){location.replace('/login?next=%2Faccount');return;}state.hidden=true;document.querySelector('#account-details').hidden=false;document.querySelector('#account-email').textContent=auth.user.email||'Authenticated user';document.querySelector('#sign-out').addEventListener('click',()=>auth.signOut());});</script></body></html>
